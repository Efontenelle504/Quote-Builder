<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User Management</title>
  <style>
    body { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; background:#f7f7f7; margin:0; }
    .toolbar { padding:12px 16px; border-bottom:2px solid #b11226; background:#fff; display:flex; justify-content:space-between; align-items:center; }
    .wrap { max-width:900px; margin:16px auto; padding:0 16px; }
    table { width:100%; border-collapse:collapse; background:#fff; border-radius:8px; overflow:hidden; }
    th, td { padding:8px; border-bottom:1px solid #e5e7eb; text-align:left; font-size:14px; }
    th { background:#f3f4f6; font-weight:600; }
    h1 { margin:0; font-size:18px; }
    .card { background:#fff; border-radius:8px; padding:12px 16px; margin-bottom:16px; box-shadow:0 1px 2px rgba(0,0,0,0.05); }
    label { display:block; margin-bottom:8px; font-weight:600; font-size:14px; }
    input, select { width:100%; padding:8px; border-radius:6px; border:1px solid #e5e7eb; font-size:14px; }
    button { padding:8px 12px; border-radius:6px; border:1px solid #e5e7eb; background:#b11226; color:#fff; cursor:pointer; font-size:14px; }
    .muted { font-size:12px; color:#6b7280; }
  </style>
</head>
<body>
  <div class="toolbar">
    <h1>User Management</h1>
    <button onclick="window.location.href='/final_quote_builder.html'">Back to Builder</button>
  </div>
  <div class="wrap">
    <div class="card">
      <h2 style="margin-top:0;font-size:16px;">Create User</h2>
      <label>Email<input id="newEmail" type="email" /></label>
      <label>Password<input id="newPassword" type="password" /></label>
      <label>Role
        <select id="newRole">
          <option value="SALES">Sales</option>
          <option value="ADMIN">Admin</option>
        </select>
      </label>
      <button id="createBtn">Create</button>
      <div class="muted" id="createStatus"></div>
    </div>
    <div class="card">
      <h2 style="margin-top:0;font-size:16px;">Existing Users</h2>
      <table>
        <thead>
          <tr><th>Email</th><th>Role</th><th>Created</th></tr>
        </thead>
        <tbody id="userRows"></tbody>
      </table>
      <div class="muted" id="listStatus"></div>
    </div>
  </div>
  <script>
    async function loadUsers(){
      const status = document.getElementById('listStatus');
      status.textContent = 'Loading...';
      try{
        const res = await fetch('/api/admin/users');
        if(!res.ok){
          const text = await res.text();
          throw new Error(text || 'Unable to load users.');
        }
        const users = await res.json();
        const tbody = document.getElementById('userRows');
        tbody.innerHTML = '';
        if(!users.length){
          tbody.innerHTML = '<tr><td colspan="3" class="muted">No users yet.</td></tr>';
        } else {
          users.forEach(u => {
            const tr = document.createElement('tr');
            tr.innerHTML = '<td>'+u.email+'</td><td>'+u.role+'</td><td>'+new Date(u.createdAt).toLocaleString()+'</td>';
            tbody.appendChild(tr);
          });
        }
        status.textContent = '';
      }catch(err){
        status.textContent = err.message || 'Unable to load users.';
      }
    }

    document.getElementById('createBtn').addEventListener('click', async () => {
      const email = document.getElementById('newEmail').value.trim();
      const password = document.getElementById('newPassword').value;
      const role = document.getElementById('newRole').value;
      const status = document.getElementById('createStatus');
      status.textContent = 'Creating user...';
      try{
        const res = await fetch('/api/admin/users', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ email, password, role })
        });
        if(!res.ok){
          const text = await res.text();
          throw new Error(text || 'Unable to create user.');
        }
        status.textContent = 'User created.';
        document.getElementById('newEmail').value = '';
        document.getElementById('newPassword').value = '';
        await loadUsers();
      }catch(err){
        status.textContent = err.message || 'Unable to create user.';
        status.style.color = '#b11226';
      }
    });

    loadUsers();
  </script>
</body>
</html>
