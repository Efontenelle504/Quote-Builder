<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <style>
    body { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; background: #f7f7f7; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
    .card { background:#fff; padding:24px; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,0.08); width:320px; }
    h1 { margin:0 0 16px 0; font-size:20px; text-align:center; }
    label { display:block; margin-bottom:12px; font-weight:600; }
    input { width:100%; padding:10px; border:1px solid #e5e7eb; border-radius:8px; font-size:14px; }
    button { width:100%; padding:10px; border:none; border-radius:8px; background:#b11226; color:#fff; font-weight:600; cursor:pointer; margin-top:8px; }
    .status { margin-top:12px; font-size:13px; color:#666; }
  </style>
  <script src="/auth-guard.js"></script>
</head>
<body>
  <div class="card">
    <h1>Login</h1>
    <label>Email
      <input id="email" type="email" placeholder="you@example.com" />
    </label>
    <label>Password
      <input id="password" type="password" placeholder="••••••••" />
    </label>
    <button id="loginBtn">Login</button>
    <div class="status" id="status"></div>
  </div>
  <script>
    const statusEl = document.getElementById('status');
    const btn = document.getElementById('loginBtn');
    btn.addEventListener('click', async () => {
      const email = (document.getElementById('email').value || '').trim();
      const password = document.getElementById('password').value || '';
      statusEl.textContent = 'Signing in...';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        if (!res.ok) {
          const text = await res.text();
          throw new Error(text || 'Login failed');
        }
        const data = await res.json();
        window.authGuard.setToken(data.token);
        statusEl.textContent = 'Success. Redirecting...';
        window.location.href = '/final_quote_builder.html';
      } catch (err) {
        statusEl.textContent = err.message || 'Login failed';
        statusEl.style.color = '#b11226';
      }
    });
  </script>
</body>
</html>
